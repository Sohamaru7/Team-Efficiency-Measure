<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Team Efficiency Measure{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Team Efficiency Measure</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" data-nav="/" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" data-nav="/tasks" href="/tasks">My Tasks</a></li>
                    <li class="nav-item"><a class="nav-link" data-nav="/daily-update" href="/daily-update">Daily Update</a></li>
                    <li class="nav-item"><a class="nav-link" data-nav="/performance" href="/performance">My Performance</a></li>
                    <li class="nav-item"><a class="nav-link" data-nav="/manager" href="/manager">Manager Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" data-nav="/manager/assistant" href="/manager/assistant">AI Assistant</a></li>
                    <li class="nav-item"><a class="nav-link" data-nav="/manager/import-export" href="/manager/import-export">Import / Export</a></li>
                    <li class="nav-item"><a class="nav-link" data-nav="/manager/daily-report" href="/manager/daily-report">Daily Report</a></li>
                </ul>
                <div class="d-flex align-items-center gap-2" id="auth-nav"></div>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/common.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
